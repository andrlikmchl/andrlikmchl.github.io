<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>My pages</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101827;
      --panel: #182436;
      --panel-hover: #202f44;
      --text: #f3f6fb;
      --muted: #a8b4c5;
      --accent: #73d5c0;
      --border: rgba(255, 255, 255, .1);
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 64px 24px;
      color: var(--text);
      background: radial-gradient(ellipse at top, #1d3448 0, var(--bg) 55%);
      font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(920px, 100%); margin: 0 auto; }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(2.4rem, 7vw, 4.5rem); line-height: 1.05; letter-spacing: -.05em; }
    .intro { max-width: 580px; margin: 18px 0 40px; color: var(--muted); font-size: 1.08rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; }
    .card {
      display: flex;
      min-height: 190px;
      flex-direction: column;
      padding: 24px;
      color: inherit;
      text-decoration: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }
    .card:hover, .card:focus-visible { transform: translateY(-3px); background: var(--panel-hover); border-color: var(--accent); }
    .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .icon { margin-bottom: 20px; font-size: 1.8rem; }
    .card h2 { margin: 0; font-size: 1.35rem; }
    .card p { margin: 8px 0 20px; color: var(--muted); }
    .card .link { margin-top: auto; color: var(--accent); font-weight: 700; }
    footer { margin-top: 48px; color: var(--muted); font-size: .9rem; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Personal space</p>
    <h1>My pages</h1>
    <p class="intro">A collection of projects, notes, and useful resources. Choose a page to get started.</p>

    <section class="grid" aria-label="Pages">
      <a class="card" href="/fasady/">
        <span class="icon" aria-hidden="true">🏢</span>
        <h2>Ceramic façades</h2>
        <p>Technical notes, systems, references, and requirements for ventilated ceramic façades.</p>
        <span class="link">Open page <span aria-hidden="true">→</span></span>
      </a>

      <!-- Add another card here when you publish another page, for example:
      <a class="card" href="/another-page/">
        <span class="icon" aria-hidden="true">✨</span>
        <h2>Another project</h2>
        <p>A short description of the page.</p>
        <span class="link">Open page →</span>
      </a>
      -->
    </section>

    <footer>More pages will appear here as they are added.</footer>
  </main>
</body>
</html>
